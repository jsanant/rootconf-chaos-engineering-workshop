kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Publish NodePorts on the host so UIs work without kubectl port-forward.
    # (Docker Desktop / macOS/Windows cannot reach kind NodePorts otherwise.)
    extraPortMappings:
      - containerPort: 30030
        hostPort: 3000
        protocol: TCP
      - containerPort: 32333
        hostPort: 2333
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
