apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kube-apiserver-kill
  namespace: default
  labels:
    experiment: kube-apiserver-kill
    workshop: cnpg-chaos
spec:
  action: pod-kill
  mode: all
  duration: 30s
  selector:
    namespaces:
      - kube-system
    labelSelectors:
      component: kube-apiserver
      tier: control-plane
