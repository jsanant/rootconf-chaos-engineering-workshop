apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: primary-pod-kill
  namespace: default
  labels:
    experiment: primary-pod-kill
    workshop: cnpg-chaos
spec:
  action: pod-kill
  mode: one
  duration: 30s
  selector:
    namespaces:
      - default
    labelSelectors:
      cnpg.io/cluster: pg-cluster
      role: primary
