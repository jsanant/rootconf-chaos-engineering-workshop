# Scrape CNPG instance metrics into kube-prometheus-stack.
# Requires prometheus.prometheusSpec.podMonitorSelectorNilUsesHelmValues=false
# (set by make monitoring) so Prometheus picks up monitors outside its release labels.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pg-cluster
  namespace: default
  labels:
    app.kubernetes.io/name: cloudnative-pg
    cnpg.io/cluster: pg-cluster
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pg-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
